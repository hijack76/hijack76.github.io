<!DOCTYPE html>
<html lang="en">
<head>

  <title>Page Not Found | KSHS Main Library</title>
  <link rel="stylesheet" href="dist/output.css">

  <meta name="robots" content="noindex">

<body class="bg-[#1b5e20] text-white min-h-flex flex-col">
  <a href="#" class="skip-link">Skip to main content</a>

    <div class="container mx-auto px-4 py-2 flex items-center justify-between">
      <div class="flex items-center space-x-4 flex-shrink-0">
        <img src="https://kshs.ac.ug/images/kampala%20logo.png" alt="KSHS Logo" class="h-11 w-auto object-contain" loading="lazy">

      <nav class="hidden lg:flex space-x-5 items-center">

      </p>
      <a href="./" class="btn-secondary">Return to Home</a>
    </div>
  </main>

  <footer class="bg-[#1b5e20] text-white py-4 border-t-4 border-[#ffc107] mt-auto w-full">
    <div class="max-w-6xl mx-auto px-6 text-center">
      <p class="text-xs text-gray-400">&copy; 2026 Kampala School of Health Sciences Main Library. All Rights Reserved.</p>
    </div>
  </footer>

</html>
