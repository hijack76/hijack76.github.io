name: Website checks

on:
  push:
    branches: [main, cleanup/remove-non-webp-images]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-smoke-check:
    name: Check homepage and image assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify homepage references and WebP carousel
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          import sys

          root = Path(".")
          homepage = root / "index.html"
          if not homepage.is_file():
              sys.exit("FAIL: index.html is missing")

          class AssetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.references = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ("src", "href"):
                      value = attrs.get(key)
                      if value:
                          self.references.append(value.strip())

          parser = AssetParser()
          parser.feed(homepage.read_text(encoding="utf-8"))

          missing = []
          for reference in parser.references:
              parsed = urlsplit(reference)
              if parsed.scheme or parsed.netloc or not parsed.path:
                  continue
              path = unquote(parsed.path)
              if path.startswith("/") or path.startswith("#"):
                  continue
              if not (root / path).is_file():
                  missing.append(reference)

          if missing:
              print("FAIL: broken local references:")
              for item in sorted(set(missing)):
                  print(f"  - {item}")
              sys.exit(1)

          images_dir = root / "site images"
          expected = [
              images_dir / (f"hero-bg{i} .webp" if i == 5 else f"hero-bg{i}.webp")
              for i in range(1, 35)
          ]
          absent = [str(path) for path in expected if not path.is_file()]
          if absent:
              print("FAIL: missing carousel WebP files:")
              for item in absent:
                  print(f"  - {item}")
              sys.exit(1)

          invalid = []
          for path in expected:
              data = path.read_bytes()
              if len(data) < 12 or data[:4] != b"RIFF" or data[8:12] != b"WEBP":
                  invalid.append(str(path))
          if invalid:
              print("FAIL: files with .webp extension but invalid WebP signatures:")
              for item in invalid:
                  print(f"  - {item}")
              sys.exit(1)

          print(f"PASS: homepage local references resolve; all {len(expected)} carousel images exist and have WebP signatures.")
          PY
